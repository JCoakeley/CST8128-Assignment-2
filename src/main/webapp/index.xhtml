<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
                      "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>Bouncer Administration</title>

        <style>
            body
            {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                margin: 0;
            }

            .container
            {
                max-width: 800px;
                margin: 40px auto;
                padding: 20px;
            }

            .card
            {
                background-color: white;
                border-radius: 8px;
                padding: 25px;
                margin-bottom: 20px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            }

            h1
            {
                margin-top: 0;
            }

            .nav-link
            {
                display: block;
                padding: 10px 0;
                text-decoration: none;
                font-weight: bold;
            }

            .language-buttons input
            {
                margin-right: 10px;
            }

            .footer-links
            {
                margin-top: 20px;
            }
        </style>

    </h:head>

    <f:view locale="#{localeBean.locale}">
        <f:loadBundle basename="Bundle" var="msg"/>

        <h:body>

            <div class="container">

                <div class="card">

                    <h1>Bouncer Administration</h1>

                    <p>
                        #{msg.GreetingMessage}
                    </p>

                    <p>
                        Use the administration area to manage
                        Bouncers, user accounts, and application settings.
                    </p>

                </div>

                <div class="card">

                    <h2>Management</h2>

                    <h:link
                        outcome="/bouncer/List"
                        value="#{msg.CreateBouncerShowAllLink}"
                        styleClass="nav-link"/>

                    <h:link
                        outcome="/appUser/List"
                        value="Manage Users"
                        styleClass="nav-link"/>

                </div>

                <div class="card">

                    <h2>Language</h2>

                    <h:form styleClass="language-buttons">

                        <h:commandButton
                            action="#{localeBean.changeLocale('en')}"
                            value="English"/>

                        <h:commandButton
                            action="#{localeBean.changeLocale('fr')}"
                            value="Français"/>

                    </h:form>

                </div>

                <div class="card">

                    <h2>Navigation</h2>

                    <div class="footer-links">

                        <h:outputLink value="#{request.contextPath}/index.html">
                            Return to Public View
                        </h:outputLink>

                        <br/>

                    </div>

                </div>

            </div>

        </h:body>

    </f:view>

</html>
